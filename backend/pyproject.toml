[project]
name = "gym-api"
version = "0.1.0"
description = "Backend API for the gym workout tracker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.114",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3,ssm]>=5.2.4",
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
