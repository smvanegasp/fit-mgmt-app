<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <title>Gym log</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- App icon and "Add to Home Screen". The manifest is .json so S3 serves it as JSON. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <script>
      // Apply dark mode before the first paint (no white flash). Same logic as src/lib/theme.ts.
      try {
        var t = localStorage.getItem("gym.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
