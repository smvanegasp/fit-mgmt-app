<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The gym's mark: the set glyph as a ladder. Three columns of squares growing 2, 3, 4 (more
       sets and reps); the past ones faded, the current one solid. scripts/make-icons.mjs renders
       the app icons from the <g id="mark"> below. -->
  <rect width="256" height="256" rx="56" fill="#2563eb"/>
  <g id="mark" fill="#ffffff">
    <g opacity="0.55">
      <rect x="62" y="176" width="36" height="36" rx="7"/>
      <rect x="62" y="132" width="36" height="36" rx="7"/>
    </g>
    <g opacity="0.78">
      <rect x="110" y="176" width="36" height="36" rx="7"/>
      <rect x="110" y="132" width="36" height="36" rx="7"/>
      <rect x="110" y="88" width="36" height="36" rx="7"/>
    </g>
    <rect x="158" y="176" width="36" height="36" rx="7"/>
    <rect x="158" y="132" width="36" height="36" rx="7"/>
    <rect x="158" y="88" width="36" height="36" rx="7"/>
    <rect x="158" y="44" width="36" height="36" rx="7"/>
  </g>
</svg>
